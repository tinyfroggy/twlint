name: Publish

on:
  push:
    branches:
      - main
  release:
    types:
      - published
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Check if version changed
        id: check
        run: |
          PUBLISHED=$(npm view ${{ github.event.repository.name }} version 2>/dev/null || echo "none")
          CURRENT=$(node -p "require('./package.json').version")
          if [ "$PUBLISHED" != "$CURRENT" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Version $CURRENT (published: $PUBLISHED) — will publish"
          else
            echo "Version $CURRENT unchanged — skipping publish"
          fi

      - name: Run checks
        if: steps.check.outputs.changed == 'true'
        run: npm run check

      - name: Build package
        if: steps.check.outputs.changed == 'true'
        run: npm run build

      - name: Publish to npm
        if: steps.check.outputs.changed == 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
