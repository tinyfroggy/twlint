name: Publish

on:
  push:
    branches:
      - main
  release:
    types:
      - published
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Check if version changed
        id: check
        run: |
          PUBLISHED=$(npm view ${{ github.event.repository.name }} version 2>/dev/null || echo "none")
          CURRENT=$(node -p "require('./package.json').version")
          if [ "$PUBLISHED" != "$CURRENT" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Version $CURRENT (published: $PUBLISHED) — will publish"
          else
            echo "Version $CURRENT unchanged — skipping publish"
          fi

      - name: Verify npm token is present
        if: steps.check.outputs.changed == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::NPM_TOKEN secret is empty or missing. Add an npm automation token as a secret named NPM_TOKEN to the 'release' environment (Settings → Environments → release → Secrets), not as an environment."
            exit 1
          fi

      - name: Run checks
        if: steps.check.outputs.changed == 'true'
        run: npm run check

      - name: Build package
        if: steps.check.outputs.changed == 'true'
        run: npm run build

      - name: Publish to npm
        if: steps.check.outputs.changed == 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
