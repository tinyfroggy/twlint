name: twlinter
description: Scan a Tailwind CSS project for non-canonical classes
author: tinyfroggy

branding:
  icon: check-circle
  color: green

inputs:
  version:
    description: twlinter version or dist-tag to run
    required: false
    default: latest
  args:
    description: Additional arguments passed to the twlinter CLI
    required: false
    default: ""
  working-directory:
    description: Directory to run twlinter in, relative to the workspace
    required: false
    default: "."

runs:
  using: composite
  steps:
    - name: Run twlinter
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npx --yes twlinter@${{ inputs.version }} ${{ inputs.args }}
