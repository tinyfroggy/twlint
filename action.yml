name: twlinter
description: Scan a Tailwind CSS project for non-canonical classes
author: tinyfroggy

branding:
  icon: check-circle
  color: green

inputs:
  version:
    description: >-
      twlinter version or dist-tag to run. Pinned by default for reproducible
      results; set to "latest" to always use the newest release.
    required: false
    default: "0.7.0"
  args:
    description: Additional arguments passed to the twlinter CLI
    required: false
    default: ""
  working-directory:
    description: Directory to run twlinter in, relative to the workspace
    required: false
    default: "."

runs:
  using: composite
  steps:
    - name: Run twlinter
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        TWLINTER_VERSION: ${{ inputs.version }}
        TWLINTER_ARGS: ${{ inputs.args }}
      run: |
        read -r -a twlinter_args <<< "$TWLINTER_ARGS" || true
        npx --yes "twlinter@$TWLINTER_VERSION" "${twlinter_args[@]}"
